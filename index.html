<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motorsykkel Speed Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🏍️ Speed Tracker</h1>
    
    <div id="speed">0</div>
    <p style="margin: 5px 0;">km/t</p>
    <div id="max-speed">Maks: 0 km/t</div>
    
    <div class="metrics-grid">
        <div class="metric-box">Distanse<span id="distance" class="metric-value">0.0</span> km</div>
        <div class="metric-box">Snittfart<span id="avg-speed" class="metric-value">0</span> km/t</div>
        <div class="metric-box">Tid<span id="time" class="metric-value">00:00</span></div>
        <div class="metric-box">Høyde<span id="altitude" class="metric-value">0</span> m</div>
    </div>
    
    <div class="button-container">
        <button id="btn-toggle" onclick="toggleTracking()">Start Sporing</button>
        <button id="btn-reset" onclick="resetRide()">Nullstill Tur</button>
    </div>
    
    <div id="status">Venter på GPS-signal...</div>
    
    <div id="map"></div>
    
    <div class="log">
        <h2 style="margin-top:0; font-size: 1.2rem;">Siste hendelser</h2>
        <pre id="log-output">Applikasjon lastet inn.</pre>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <div class="log">
        <h2 style="margin-top:0; font-size: 1.2rem;">Lagrede Turer 📁</h2>
        <div id="saved-rides-list">Ingen lagrede turer ennå.</div>
    </div>
<script src="script.js"></script>
</body>
</html>
